<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ВА-БАНК — немецкий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   ПАЛИТРА И БАЗА
   ================================================================ */
:root{
  --bg:#1a1240; --bg-2:#2d1b69; --yellow:#FFD93D; --pink:#FF3D8B;
  --cyan:#4ECDC4; --green:#95E061; --orange:#FF9F1C; --red:#FF4444;
  --gold:#FFDC5C; --ink:#14102b;
  --f-head:'Bangers','Impact','Haettenschweiler',system-ui,sans-serif;
  --f-body:'Fredoka','Trebuchet MS',system-ui,sans-serif;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
/* hidden должен побеждать display:flex у .stage/.verdict/.next-row */
[hidden]{ display:none !important; }
html,body{ overflow-x:hidden; max-width:100%; margin:0; padding:0; }
body{
  min-height:100vh;
  font-family:var(--f-body);
  color:#fff;
  background:
    radial-gradient(circle at 14% 18%, rgba(255,61,139,.38), transparent 46%),
    radial-gradient(circle at 86% 14%, rgba(78,205,196,.32), transparent 46%),
    radial-gradient(circle at 50% 96%, rgba(255,217,61,.22), transparent 52%),
    linear-gradient(135deg, var(--bg), var(--bg-2));
  background-attachment:fixed;
  padding:10px 10px 26px;
}
/* Полутоновая сетка поверх фона */
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:radial-gradient(circle, rgba(255,255,255,.06) 1px, transparent 1px);
  background-size:22px 22px;
}
.wrap{ position:relative; z-index:1; width:100%; max-width:760px; margin:0 auto; }

/* ================================================================
   ОБЩИЕ КОМИКС-ЭЛЕМЕНТЫ
   ================================================================ */
.card{
  border:5px solid var(--ink);
  border-radius:20px;
  box-shadow:6px 6px 0 var(--ink);
  background:#fff;
  color:var(--ink);
}
/* Физические кнопки — общий контракт */
.btn{
  font-family:var(--f-head);
  letter-spacing:1px;
  border:5px solid var(--ink);
  border-radius:18px;
  box-shadow:6px 6px 0 var(--ink);
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  cursor:pointer;
  color:var(--ink);
  min-height:52px;
  padding:10px 18px;
  background:var(--yellow);
  font-size:1.35rem;
  line-height:1.05;
  user-select:none;
}
.btn:hover{ transform:translate(-3px,-3px); box-shadow:9px 9px 0 var(--ink); }
.btn:active{ transform:translate(4px,4px); box-shadow:2px 2px 0 var(--ink); }
.btn:disabled{ cursor:default; filter:grayscale(.55) brightness(.85); opacity:.65; }
.btn:disabled:hover{ transform:none; box-shadow:6px 6px 0 var(--ink); }

/* ================================================================
   ШАПКА: ЗАГОЛОВОК, СЧЁТ, РАУНД, ПРОГРЕСС
   ================================================================ */
.title{
  font-family:var(--f-head);
  font-size:clamp(2.6rem,11vw,4.6rem);
  line-height:.92;
  text-align:center;
  margin:6px 0 2px;
  transform:rotate(-2deg);
  background:linear-gradient(180deg,var(--gold) 0%,var(--orange) 55%,var(--pink) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(4px 4px 0 var(--ink));
  letter-spacing:2px;
}
.subtitle{
  text-align:center; font-size:clamp(.78rem,3vw,.98rem); font-weight:600;
  color:#ffe9b8; margin:0 0 12px; opacity:.9;
}
.hud{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:rgba(20,16,43,.55);
  border:5px solid var(--ink); border-radius:20px; box-shadow:6px 6px 0 var(--ink);
  padding:8px 12px; transform:rotate(-.6deg); margin-bottom:14px;
}
.hud-side{ min-width:86px; }
.hud-label{ font-family:var(--f-body); font-weight:700; font-size:.7rem; letter-spacing:1px;
  text-transform:uppercase; color:#bdb2ff; }
.round-box{ font-family:var(--f-head); font-size:1.5rem; color:var(--cyan); letter-spacing:1px; }
.goal-box{ text-align:right; font-family:var(--f-head); font-size:1.5rem; color:var(--yellow); letter-spacing:1px; }
.score-box{ text-align:center; flex:1; }
.score{
  font-family:var(--f-head);
  font-size:clamp(3rem,14vw,4.6rem);
  line-height:.9;
  color:var(--yellow);
  text-shadow:4px 4px 0 var(--ink);
  display:inline-block;
  transition:color .2s ease;
}
.score.bump{ animation:scoreBump .45s cubic-bezier(0.68,-0.55,0.265,1.55); }
.score.up{ color:var(--green); }
.score.down{ color:var(--red); }
@keyframes scoreBump{
  0%{ transform:scale(1) rotate(0deg); }
  40%{ transform:scale(1.42) rotate(-4deg); }
  70%{ transform:scale(.92) rotate(2deg); }
  100%{ transform:scale(1) rotate(0deg); }
}
/* Полоса прогресса к 30 очкам */
.bar-row{ display:flex; align-items:center; gap:8px; margin:-4px 0 16px; }
.bar{
  position:relative; flex:1; height:26px; overflow:hidden;
  background:rgba(0,0,0,.45);
  border:5px solid var(--ink); border-radius:14px; box-shadow:6px 6px 0 var(--ink);
  transform:rotate(.5deg);
}
.bar-fill{
  position:absolute; inset:0; transform-origin:left center; transform:scaleX(0);
  background:linear-gradient(90deg,var(--cyan),var(--green),var(--yellow));
  transition:transform .65s cubic-bezier(0.68,-0.55,0.265,1.55);
}
.bar.near{ animation:barGlow 1.1s ease-in-out infinite; }
@keyframes barGlow{
  0%,100%{ box-shadow:6px 6px 0 var(--ink), 0 0 0 rgba(255,220,92,0); }
  50%{ box-shadow:6px 6px 0 var(--ink), 0 0 26px rgba(255,220,92,.95); }
}
.bar-cap{ font-family:var(--f-head); font-size:1.2rem; color:#ffe9b8; letter-spacing:1px; }

/* ================================================================
   КАРТОЧКА ЗАДАНИЯ
   ================================================================ */
.task-card{
  background:linear-gradient(160deg,#fffdf2,#ffeec9);
  padding:16px 14px 18px; text-align:center; transform:rotate(-1deg);
  margin-bottom:16px;
}
.task-card.pop{ animation:cardPop .5s cubic-bezier(0.68,-0.55,0.265,1.55); }
@keyframes cardPop{
  0%{ transform:rotate(-1deg) scale(.72); opacity:0; }
  60%{ transform:rotate(-1deg) scale(1.07); opacity:1; }
  100%{ transform:rotate(-1deg) scale(1); opacity:1; }
}
.task-label{
  display:inline-block; font-family:var(--f-head); font-size:1rem; letter-spacing:2px;
  background:var(--pink); color:#fff; border:4px solid var(--ink); border-radius:12px;
  padding:2px 12px; box-shadow:4px 4px 0 var(--ink); transform:rotate(-2deg); margin-bottom:10px;
}
.task-text{
  font-family:var(--f-head); font-size:clamp(1.9rem,8.4vw,3.2rem); line-height:1.05;
  color:var(--ink); letter-spacing:1px; word-break:break-word;
}

/* ================================================================
   ЭТАП 1 — СТАВКА (ФИШКИ)
   ================================================================ */
.stage{ margin-bottom:14px; }
.stage-hint{
  text-align:center; font-weight:700; font-size:clamp(.95rem,3.6vw,1.15rem);
  color:#ffe9b8; margin-bottom:12px;
}
.chips{ display:flex; align-items:flex-end; justify-content:center; gap:10px; flex-wrap:wrap; }
.chip-slot{ display:flex; }
.slot1{ transform:rotate(-2deg); }
.slot2{ transform:rotate(1.5deg); }
.slot3{ animation:chipLure 1.5s ease-in-out infinite; }
@keyframes chipLure{
  0%,100%{ transform:rotate(-1.5deg) scale(1); }
  50%{ transform:rotate(-1.5deg) scale(1.07); }
}
.chip{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  width:104px; min-height:104px; border-radius:22px; padding:8px 6px;
}
.chip .num{ font-family:var(--f-head); font-size:2.5rem; line-height:.9; }
.chip .cap{ font-family:var(--f-body); font-weight:700; font-size:.68rem; line-height:1.1;
  letter-spacing:0; text-align:center; }
.chip1{ background:var(--cyan); }
.chip2{ background:var(--yellow); }
.chip3{
  background:linear-gradient(160deg,var(--pink),#ff6fae);
  color:#fff; width:132px; min-height:132px; border-width:6px;
  box-shadow:7px 7px 0 var(--ink);
}
.chip3 .num{ font-size:3.4rem; text-shadow:3px 3px 0 var(--ink); }
.chip3 .cap{ font-size:.76rem; text-shadow:1px 1px 0 rgba(0,0,0,.35); }
.chip3:hover{ box-shadow:10px 10px 0 var(--ink); }

/* ================================================================
   ЭТАП 2 — ОТВЕТ ВСЛУХ, ВЕРДИКТ УЧИТЕЛЯ
   ================================================================ */
.bet-badge{
  display:block; width:max-content; max-width:100%; margin:0 auto 10px;
  font-family:var(--f-head); font-size:1.35rem; letter-spacing:1px;
  background:var(--gold); color:var(--ink);
  border:5px solid var(--ink); border-radius:16px; box-shadow:6px 6px 0 var(--ink);
  padding:4px 16px; transform:rotate(-1.5deg);
}
.bet-badge.b3{
  background:var(--pink); color:#fff; font-size:1.6rem;
  box-shadow:6px 6px 0 var(--ink), 0 0 24px rgba(255,61,139,.85);
  text-shadow:2px 2px 0 rgba(0,0,0,.35);
}
/* ставка влетает с перелётом — нерв момента выбора */
.bet-badge.pop{ animation:betPop .5s cubic-bezier(0.68,-0.55,0.265,1.55); }
@keyframes betPop{
  0%{ transform:rotate(-1.5deg) scale(.25); opacity:0; }
  60%{ transform:rotate(-1.5deg) scale(1.28); opacity:1; }
  100%{ transform:rotate(-1.5deg) scale(1); opacity:1; }
}
.verdict{ display:flex; justify-content:center; gap:14px; flex-wrap:wrap; }
.v-slot{ display:flex; }
.v-slot.a{ transform:rotate(-1.5deg); }
.v-slot.b{ transform:rotate(1.5deg); }
.btn-ok{ background:var(--green); min-width:150px; font-size:1.5rem; }
.btn-no{ background:var(--red); color:#fff; min-width:150px; font-size:1.5rem; text-shadow:2px 2px 0 rgba(0,0,0,.3); }
.suspense{
  text-align:center; font-family:var(--f-head); font-size:2.4rem; letter-spacing:6px;
  color:var(--gold); animation:susp .7s ease-in-out infinite;
}
@keyframes susp{ 0%,100%{ opacity:.35; transform:scale(.96);} 50%{ opacity:1; transform:scale(1.06);} }

/* ================================================================
   ПАНЕЛЬ-ОБЪЯСНЯЛКА
   ================================================================ */
.explain{ padding:14px; transform:rotate(.7deg); margin-bottom:14px; }
.explain.good{ background:linear-gradient(160deg,#eaffd8,#d3f7bd); }
.explain.bad{ background:linear-gradient(160deg,#ffe6e6,#ffd0d0); }
.explain .verdict-line{
  font-family:var(--f-head); font-size:1.6rem; letter-spacing:1px; margin-bottom:6px;
}
.explain.good .verdict-line{ color:#2e7d0f; }
.explain.bad .verdict-line{ color:#c01414; }
.explain .answer-line{ font-family:var(--f-head); font-size:1.7rem; color:var(--ink); letter-spacing:1px; }
.explain .answer-line span{ color:#7a2ea8; }
.explain .hint-line{
  font-family:var(--f-body); font-weight:500; font-size:.98rem; line-height:1.4; color:#2a2340;
  margin-top:8px; border-top:3px dashed rgba(20,16,43,.35); padding-top:8px;
}
.next-row{ display:flex; justify-content:center; margin-bottom:16px; }
.next-slot{ transform:rotate(-1deg); }
.btn-next{ background:var(--cyan); min-width:190px; font-size:1.5rem; }

/* ================================================================
   ИСТОРИЯ СТАВОК
   ================================================================ */
.history-block{
  background:rgba(20,16,43,.5); border:5px solid var(--ink); border-radius:20px;
  box-shadow:6px 6px 0 var(--ink); padding:10px 12px; transform:rotate(.6deg);
}
.history-title{
  font-family:var(--f-head); font-size:1.1rem; letter-spacing:2px; color:#bdb2ff; margin-bottom:8px;
}
.history{ display:flex; flex-wrap:wrap; gap:7px; min-height:40px; align-items:center; }
.dot{
  width:40px; height:40px; border-radius:50%; border:4px solid var(--ink);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--f-head); font-size:1.05rem; letter-spacing:0;
  box-shadow:3px 3px 0 var(--ink); color:var(--ink);
}
.dot.win{ background:var(--green); }
.dot.lose{ background:var(--red); color:#fff; }
.dot.b3{ width:46px; height:46px; font-size:1.2rem; border-width:5px; }
.dot.fresh{ animation:dotPop .45s cubic-bezier(0.68,-0.55,0.265,1.55); }
@keyframes dotPop{ 0%{ transform:scale(0) rotate(-40deg);} 65%{ transform:scale(1.3) rotate(8deg);} 100%{ transform:scale(1) rotate(0);} }
.dot-empty{ font-family:var(--f-body); font-weight:600; font-size:.85rem; color:#8f85c9; }

/* ================================================================
   КРИК ВО ВЕСЬ ЭКРАН, ТРЯСКА, ВСПЫШКА, ЧАСТИЦЫ
   ================================================================ */
.shout-layer{
  position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
  pointer-events:none; overflow:hidden;
  background:radial-gradient(circle at 50% 50%, rgba(10,6,30,0), rgba(10,6,30,0) 70%);
  transition:background .2s ease;
}
/* затемняем сцену, пока кричит надпись — иначе она сливается с панелью */
.shout-layer.on{
  background:radial-gradient(circle at 50% 50%, rgba(10,6,30,.62), rgba(10,6,30,0) 72%);
}
.shout{
  font-family:var(--f-head);
  -webkit-text-stroke:3px var(--ink);
  text-align:center; line-height:.92; letter-spacing:2px;
  opacity:0; transform:scale(.3) rotate(-8deg);
  transition:opacity .18s ease, transform .38s cubic-bezier(0.68,-0.55,0.265,1.55);
  max-width:100%;
}
.shout.show{ opacity:1; transform:scale(1) rotate(-3deg); }
.shout.big{ font-size:clamp(4rem,16vw,9rem); }
.shout.mid{ font-size:clamp(2.4rem,9vw,5rem); }
.shout.gold{ color:var(--gold); filter:drop-shadow(6px 6px 0 rgba(0,0,0,.45)); }
.shout.red{ color:var(--red); filter:drop-shadow(6px 6px 0 rgba(0,0,0,.45)); }
.shout.green{ color:var(--green); filter:drop-shadow(5px 5px 0 rgba(0,0,0,.45)); }
.flash{
  position:fixed; inset:0; z-index:55; pointer-events:none; opacity:0;
  transition:opacity .25s ease;
}
.flash.on{ opacity:.5; }
.flash.red{ background:radial-gradient(circle at 50% 50%, rgba(255,68,68,.9), rgba(255,68,68,0) 70%); }
.flash.gold{ background:radial-gradient(circle at 50% 50%, rgba(255,220,92,.9), rgba(255,220,92,0) 70%); }
.screen-shake{ animation:shake .5s ease-in-out; }
@keyframes shake{
  0%,100%{ transform:translate(0,0) rotate(0); }
  12%{ transform:translate(-11px,6px) rotate(-1.4deg); }
  27%{ transform:translate(10px,-7px) rotate(1.4deg); }
  43%{ transform:translate(-8px,-5px) rotate(-1deg); }
  61%{ transform:translate(7px,6px) rotate(.9deg); }
  79%{ transform:translate(-4px,2px) rotate(-.4deg); }
}
.screen-shake-soft{ animation:shakeSoft .32s ease-in-out; }
@keyframes shakeSoft{
  0%,100%{ transform:translate(0,0); }
  30%{ transform:translate(-5px,3px); }
  60%{ transform:translate(4px,-3px); }
}
.particle{ position:fixed; z-index:58; pointer-events:none; border-radius:50%; will-change:transform,opacity; }
.floater{
  position:fixed; z-index:59; pointer-events:none;
  font-family:var(--f-head); font-size:2.4rem; letter-spacing:1px;
  text-shadow:3px 3px 0 var(--ink);
}

/* ================================================================
   ЗВУК
   ================================================================ */
.sound-btn{
  position:fixed; top:8px; right:8px; z-index:70;
  width:52px; height:52px; min-height:52px; padding:0; font-size:1.5rem;
  background:var(--orange); border-radius:16px;
}

/* ================================================================
   ФИНАЛЬНАЯ МОДАЛКА
   ================================================================ */
.modal-back{
  position:fixed; inset:0; z-index:80; display:none;
  align-items:center; justify-content:center; padding:16px;
  background:rgba(10,6,30,.82);
}
.modal-back.open{ display:flex; }
.modal{
  width:100%; max-width:520px; padding:20px 16px; text-align:center;
  background:linear-gradient(160deg,#fffdf2,#ffe9c9); transform:rotate(-1deg);
  animation:modalIn .5s cubic-bezier(0.68,-0.55,0.265,1.55);
  max-height:92vh; overflow-y:auto;
}
@keyframes modalIn{
  0%{ transform:rotate(-1deg) scale(.55); opacity:0; }
  65%{ transform:rotate(-1deg) scale(1.06); opacity:1; }
  100%{ transform:rotate(-1deg) scale(1); opacity:1; }
}
.modal h2{
  font-family:var(--f-head); font-size:clamp(2.2rem,9vw,3.6rem); line-height:.95;
  margin:0 0 8px; letter-spacing:2px; color:var(--ink);
  -webkit-text-stroke:0;
}
.modal h2.win{ color:var(--orange); text-shadow:4px 4px 0 var(--ink); }
.modal h2.soft{ color:#6b46c1; text-shadow:3px 3px 0 var(--ink); }
.modal h2.bust{ color:var(--red); text-shadow:4px 4px 0 var(--ink); }
.modal .m-sub{ font-family:var(--f-body); font-weight:600; font-size:1rem; color:#2a2340; margin-bottom:12px; }
.stat-line{
  font-family:var(--f-head); font-size:clamp(1.05rem,4.2vw,1.4rem); letter-spacing:1px;
  color:var(--ink); background:var(--gold);
  border:5px solid var(--ink); border-radius:16px; box-shadow:5px 5px 0 var(--ink);
  padding:8px 12px; margin:0 auto 12px; transform:rotate(1deg); max-width:100%;
}
.m-history{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:14px; }
.m-score{ font-family:var(--f-head); font-size:2rem; color:var(--ink); margin-bottom:10px; letter-spacing:1px; }
.btn-again{ background:var(--pink); color:#fff; font-size:1.5rem; text-shadow:2px 2px 0 rgba(0,0,0,.3); }
.again-slot{ display:inline-flex; transform:rotate(-1.5deg); }

/* ================================================================
   АДАПТИВ
   ================================================================ */
@media (max-width:420px){
  /* оставляем место под кнопку звука в углу */
  .title{ font-size:clamp(2.3rem,9.6vw,4.6rem); }
  .subtitle{ padding:0 46px; }
  .chip{ width:88px; min-height:92px; }
  .chip3{ width:112px; min-height:116px; }
  .chip .num{ font-size:2.1rem; }
  .chip3 .num{ font-size:2.9rem; }
  .btn-ok,.btn-no{ min-width:130px; font-size:1.3rem; }
  .dot{ width:34px; height:34px; font-size:.9rem; }
  .dot.b3{ width:40px; height:40px; font-size:1rem; }
}
@media (min-width:900px){
  .wrap{ max-width:860px; }
}

/* ================================================================
   БЕРЕЖНЫЙ РЕЖИМ — без тряски и пульсаций, цвета остаются
   ================================================================ */
@media (prefers-reduced-motion: reduce){
  .screen-shake,.screen-shake-soft{ animation:none !important; }
  .slot3{ animation:none !important; transform:rotate(-1.5deg); }
  .bar.near{ animation:none !important; box-shadow:6px 6px 0 var(--ink), 0 0 22px rgba(255,220,92,.9); }
  .score.bump,.task-card.pop,.dot.fresh,.modal,.bet-badge.pop{ animation:none !important; }
  .suspense{ animation:none !important; opacity:1; }
  .shout{ transition:opacity .18s ease; transform:none; }
  .shout.show{ transform:none; }
}
</style>
</head>
<body>

<button class="btn sound-btn" id="soundBtn" type="button" aria-label="Звук">🔊</button>

<div class="wrap">
  <!-- ШАПКА -->
  <h1 class="title">ВА-БАНК</h1>
  <p class="subtitle">Посмотри на задание → поставь очки → отвечай вслух</p>

  <div class="hud">
    <div class="hud-side">
      <div class="hud-label">раунд</div>
      <div class="round-box"><span id="roundNum">1</span> / <span id="roundMax">8</span></div>
    </div>
    <div class="score-box">
      <div class="hud-label">очки</div>
      <div class="score" id="scoreEl">10</div>
    </div>
    <div class="hud-side">
      <div class="hud-label" style="text-align:right">цель</div>
      <div class="goal-box" id="goalBox">30</div>
    </div>
  </div>

  <div class="bar-row">
    <div class="bar" id="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="bar-cap">30</div>
  </div>

  <!-- ЗАДАНИЕ -->
  <div class="card task-card" id="taskCard">
    <div class="task-label">ЗАДАНИЕ</div>
    <div class="task-text" id="taskText">…</div>
  </div>

  <!-- ЭТАП: СТАВКА -->
  <div class="stage" id="stageBet">
    <div class="stage-hint">Сколько очков ставишь на это задание?</div>
    <div class="chips">
      <div class="chip-slot slot1">
        <button class="btn chip chip1" type="button" data-bet="1">
          <span class="num">1</span><span class="cap">уверен<br>так себе</span>
        </button>
      </div>
      <div class="chip-slot slot2">
        <button class="btn chip chip2" type="button" data-bet="2">
          <span class="num">2</span><span class="cap">вроде<br>знаю</span>
        </button>
      </div>
      <div class="chip-slot slot3">
        <button class="btn chip chip3" type="button" data-bet="3">

  <!-- ЭТАП: ОТВЕТ + ВЕРДИКТ -->
  <div class="stage" id="stageAnswer" hidden>
    <div class="bet-badge" id="betBadge">СТАВКА: 1</div>
    <div class="stage-hint" id="answerHint">Скажи ответ вслух! Учитель проверит.</div>
    <div class="verdict" id="verdictRow">
      <div class="v-slot a"><button class="btn btn-ok" id="btnOk" type="button">✅ ВЕРНО</button></div>
      <div class="v-slot b"><button class="btn btn-no" id="btnNo" type="button">❌ МИМО</button></div>

  <!-- ПАНЕЛЬ-ОБЪЯСНЯЛКА -->
  <div class="card explain" id="explain" hidden>
    <div class="verdict-line" id="explainVerdict"></div>
    <div class="answer-line" id="explainAnswer"></div>
    <div class="hint-line" id="explainHint" hidden></div>
  </div>

  <div class="next-row" id="nextRow" hidden>
    <div class="next-slot"><button class="btn btn-next" id="btnNext" type="button">ДАЛЬШЕ →</button></div>
  </div>

  <!-- ИСТОРИЯ СТАВОК -->
  <div class="history-block">
    <div class="history-title">ТВОИ СТАВКИ</div>
    <div class="history" id="history"><span class="dot-empty">Пока пусто — впереди 8 раундов</span></div>
  </div>
</div>

<!-- СЛОИ ЭФФЕКТОВ -->
<div class="flash" id="flash"></div>
<div class="shout-layer" id="shoutLayer"><div class="shout" id="shout"></div></div>

<!-- ФИНАЛЬНАЯ МОДАЛКА -->
<div class="modal-back" id="modalBack">
  <div class="card modal">
    <h2 id="modalTitle">—</h2>
    <div class="m-sub" id="modalSub"></div>
    <div class="m-score" id="modalScore"></div>
    <div class="stat-line" id="modalStats"></div>
    <div class="m-history" id="modalHistory"></div>
    <span class="again-slot"><button class="btn btn-again" id="btnAgain" type="button">🔄 ЕЩЁ РАЗОК</button></span>
  </div>
</div>

<script>
// ⬇️ ЗАМЕНИ ЭТОТ СПИСОК, ЧТОБЫ ИГРАТЬ В ЛЮБУЮ ДРУГУЮ ТЕМУ.
// Формат: prompt — что показываем, answer — правильный ответ, hint — объяснение правила.
const QUESTIONS = [
  {prompt: "ich + machen (делать)",      answer: "ich mache",   hint: "После ich → окончание -e. Основа mach- + e = mache"},
  {prompt: "du + spielen (играть)",      answer: "du spielst",  hint: "После du → окончание -st. Основа spiel- + st = spielst"},
  {prompt: "er + lernen (учить)",        answer: "er lernt",    hint: "После er/sie/es → окончание -t. Основа lern- + t = lernt"},
  {prompt: "sie + malen (рисовать)",     answer: "sie malt",    hint: "После sie (она) → окончание -t. Основа mal- + t = malt"},
  {prompt: "es + kommen (приходить)",    answer: "es kommt",    hint: "После es → окончание -t. Основа komm- + t = kommt"},
  {prompt: "wir + wohnen (жить)",        answer: "wir wohnen",  hint: "После wir → окончание -en, как инфинитив. wohn- + en = wohnen"},
  {prompt: "ihr + singen (петь)",        answer: "ihr singt",   hint: "После ihr → окончание -t. Основа sing- + t = singt"},
  {prompt: "sie + trinken (пить)",       answer: "sie trinken", hint: "После sie (они) → окончание -en. Основа trink- + en = trinken"},
  {prompt: "du + heißen (зваться)",      answer: "du heißt",    hint: "⚠️ ХИТРО! Основа уже кончается на ß (heiß-), поэтому только -t, а не -st. du heißt, НЕ du heißst"},
  {prompt: "ihr + tanzen (танцевать)",   answer: "ihr tanzt",   hint: "Основа tanz- + t = tanzt. Произносим «танцт»"},
  {prompt: "ich + sein (быть)",          answer: "ich bin",     hint: "🌟 sein — НЕПРАВИЛЬНЫЙ глагол! Учим наизусть: ich BIN"},
  {prompt: "du + sein (быть)",           answer: "du bist",     hint: "🌟 sein — НЕПРАВИЛЬНЫЙ! Учим наизусть: du BIST"},
  {prompt: "er + sein (быть)",           answer: "er ist",      hint: "🌟 sein — НЕПРАВИЛЬНЫЙ! Учим наизусть: er/sie/es IST"},
  {prompt: "wir + sein (быть)",          answer: "wir sind",    hint: "🌟 sein — НЕПРАВИЛЬНЫЙ! wir SIND"},
  {prompt: "ich + haben (иметь)",        answer: "ich habe",    hint: "В форме ich окончание обычное: hab- + e = habe"},
  {prompt: "du + haben (иметь)",         answer: "du hast",     hint: "🌟 haben — НЕПРАВИЛЬНЫЙ в du и er! Буква -b- ПРОПАДАЕТ: du HAST (не habst)"},
  {prompt: "er + haben (иметь)",         answer: "er hat",      hint: "🌟 haben — НЕПРАВИЛЬНЫЙ! Буква -b- ПРОПАДАЕТ: er HAT (не habt)"},
  {prompt: "ihr + haben (иметь)",        answer: "ihr habt",    hint: "У ihr всё честно: hab- + t = habt"},
  {prompt: "du + arbeiten (работать)",   answer: "du arbeitest",hint: "⚠️ Основа кончается на -t (arbeit-), между основой и окончанием вставляем -e-: arbeit-e-st"},
  {prompt: "er + finden (находить)",     answer: "er findet",   hint: "⚠️ Основа кончается на -d (find-), вставляем -e-: find-e-t = findet"},
  {prompt: "wir + gehen (идти)",         answer: "wir gehen",   hint: "После wir → -en. geh- + en = gehen"},
  {prompt: "ihr + lesen (читать)",       answer: "ihr lest",    hint: "Основа кончается на -s (les-), поэтому только -t: lest"},
  {prompt: "du + fahren (ехать)",        answer: "du fährst",   hint: "🌟 Корневая гласная меняется: a → ä. du FÄHRST"},
  {prompt: "er + sprechen (говорить)",   answer: "er spricht",  hint: "🌟 Корневая гласная меняется: e → i. er SPRICHT"}
];

// ================================================================
// 1. КОНСТАНТЫ И СОСТОЯНИЕ
// ================================================================
var START_SCORE = 10;   // с чего начинаем
var GOAL = 30;          // сколько нужно набрать
var TOTAL_ROUNDS = 8;   // сколько раундов даётся

var score = START_SCORE;
var round = 0;          // номер текущего раунда (1..8)
var deck = [];          // перемешанная колода заданий
var lastPrompt = null;  // чтобы не повторять задание подряд при новом круге
var current = null;     // текущее задание
var bet = 0;            // текущая ставка
var phase = 'bet';      // 'bet' | 'answer' | 'reveal' | 'result' | 'over'
var busy = false;       // защита от двойного клика
var betLog = [];        // [{bet:2, ok:true}, ...] — имя не 'history': window.history перезаписать нельзя
var timers = new Set(); // все активные таймеры — чистим при рестарте
var particles = new Set(); // живые частицы — убираем при рестарте
var scoreRaf = 0;       // id анимации счёта

// Короткие ссылки на элементы
function $(id){ return document.getElementById(id); }
var scoreEl = $('scoreEl'), roundNumEl = $('roundNum'), roundMaxEl = $('roundMax');
var barEl = $('bar'), barFillEl = $('barFill');
var taskCardEl = $('taskCard'), taskTextEl = $('taskText');
var stageBetEl = $('stageBet'), stageAnswerEl = $('stageAnswer');
var betBadgeEl = $('betBadge'), answerHintEl = $('answerHint');
var verdictRowEl = $('verdictRow'), suspenseEl = $('suspense');
var btnOk = $('btnOk'), btnNo = $('btnNo'), btnNext = $('btnNext'), nextRowEl = $('nextRow');
var explainEl = $('explain'), explainVerdictEl = $('explainVerdict');
var explainAnswerEl = $('explainAnswer'), explainHintEl = $('explainHint');
var historyEl = $('history');
var shoutEl = $('shout'), shoutLayer = $('shoutLayer'), flashEl = $('flash');
var modalBack = $('modalBack'), modalTitle = $('modalTitle'), modalSub = $('modalSub');
var modalScore = $('modalScore'), modalStats = $('modalStats'), modalHistory = $('modalHistory');
var btnAgain = $('btnAgain'), soundBtn = $('soundBtn');

// Бережный режим (пользователь не любит движение)
function reduced(){
  try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  catch(e){ return false; }
}
// Таймеры с учётом при рестарте
function later(fn, ms){
  var id = setTimeout(function(){ timers.delete(id); fn(); }, ms);
  timers.add(id);
  return id;
}
function clearTimers(){
  timers.forEach(function(id){ clearTimeout(id); });
  timers.clear();
}

// ================================================================
// 2. ЗВУК — Web Audio, тоны на лету, контекст лениво по первому жесту
// ================================================================
var actx = null;
var soundOn = true;
try {
  var saved = localStorage.getItem('vabank-sound');
  if (saved === 'off') soundOn = false;
} catch(e){ /* localStorage может быть недоступен на file:// */ }

function updateSoundBtn(){ soundBtn.textContent = soundOn ? '🔊' : '🔇'; }

function audio(){
  if (!soundOn) return null;
  try {
    if (!actx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      actx = new Ctx();
    }
    if (actx.state === 'suspended') { actx.resume().catch(function(){}); }
    return actx;
  } catch(e){ return null; }
}
// Один тон
function tone(freq, delay, dur, type, vol){
  var ctx = audio();
  if (!ctx) return;
  try {
    var t0 = ctx.currentTime + delay;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || 'triangle';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol || 0.22, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  } catch(e){ /* звук не критичен */ }
}
// Нейтральный клик
function sndClick(){ tone(620, 0, 0.09, 'square', 0.14); }
// Щелчок фишки — выше для крупной ставки
function sndChip(n){
  var base = [0, 420, 520, 660][n] || 500;
  tone(base, 0, 0.1, 'square', 0.16);
  tone(base * 1.5, 0.07, 0.14, 'triangle', 0.13);
}
// Успех — восходящее арпеджио, длиннее при крупной ставке
function sndWin(n){
  var notes = n >= 3 ? [523, 659, 784, 1047, 1319] : (n === 2 ? [523, 659, 784, 1047] : [523, 784]);
  for (var i = 0; i < notes.length; i++) tone(notes[i], i * 0.08, 0.24, 'triangle', 0.2);
}
// Провал — низкий нисходящий
function sndLose(n){
  var notes = n >= 3 ? [330, 262, 208, 165, 110] : (n === 2 ? [300, 233, 175] : [300, 220]);
  for (var i = 0; i < notes.length; i++) tone(notes[i], i * 0.09, 0.26, 'sawtooth', 0.16);
}
// Барабанная дробь ожидания
function sndSuspense(){
  for (var i = 0; i < 5; i++) tone(180 + i * 12, i * 0.11, 0.06, 'square', 0.08);
}
// Финальный фанфар
function sndFanfare(){
  var seq = [523, 659, 784, 1047, 784, 1047, 1319];
  for (var i = 0; i < seq.length; i++) tone(seq[i], i * 0.13, 0.35, 'triangle', 0.2);
  tone(262, 0, 1.2, 'sine', 0.12);
  tone(392, 0.4, 1.0, 'sine', 0.1);
}
// Мягкий финал (не дотянул)
function sndSoftEnd(){
  var seq = [440, 392, 349, 330];
  for (var i = 0; i < seq.length; i++) tone(seq[i], i * 0.16, 0.4, 'sine', 0.16);
}

// ================================================================
// 3. ЭФФЕКТЫ: тряска, вспышка, крик, частицы
// ================================================================
function shake(hard){
  if (reduced()) return;
  var cls = hard ? 'screen-shake' : 'screen-shake-soft';
  document.body.classList.remove('screen-shake', 'screen-shake-soft');
  void document.body.offsetWidth; // перезапуск анимации
  document.body.classList.add(cls);
  later(function(){ document.body.classList.remove(cls); }, hard ? 520 : 340);
}
function flash(color){
  flashEl.className = 'flash ' + color;
  void flashEl.offsetWidth;
  flashEl.classList.add('on');
  later(function(){ flashEl.classList.remove('on'); }, 260);
}
function shout(text, size, color, ms){
  shoutEl.textContent = text;
  shoutEl.className = 'shout ' + size + ' ' + color;
  void shoutEl.offsetWidth;
  shoutEl.classList.add('show');
  shoutLayer.classList.add('on');
  later(function(){
    shoutEl.classList.remove('show');
    shoutLayer.classList.remove('on');
    later(function(){ if (!shoutEl.classList.contains('show')) shoutEl.textContent = ''; }, 260);
  }, ms || 1100);
}
// Веер частиц из точки
function burst(x, y, count, colors, power){
  if (reduced()) return;
  for (var i = 0; i < count; i++) {
    var p = document.createElement('div');
    p.className = 'particle';
    var size = 8 + Math.random() * 14;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = (x - size / 2) + 'px';
    p.style.top = (y - size / 2) + 'px';
    p.style.background = colors[i % colors.length];
    if (Math.random() < 0.35) p.style.borderRadius = '4px';
    document.body.appendChild(p);
    particles.add(p);

    var angle = (Math.PI * 2) * (i / count) + (Math.random() - 0.5) * 0.5;
    var dist = (power || 260) * (0.45 + Math.random() * 0.75);
    var dx = Math.cos(angle) * dist;
    var dy = Math.sin(angle) * dist - 90 - Math.random() * 70;
    var dur = 750 + Math.random() * 550;

    try {
      var anim = p.animate([
        { transform: 'translate(0,0) scale(1) rotate(0deg)', opacity: 1 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.25) rotate(' + (Math.random() * 720 - 360) + 'deg)', opacity: 0 }
      ], { duration: dur, easing: 'cubic-bezier(.2,.7,.4,1)' });
      anim.onfinish = function(node){ return function(){ removeParticle(node); }; }(p);
    } catch(e){
      later(function(node){ return function(){ removeParticle(node); }; }(p), dur);
    }
  }
}
function removeParticle(node){
  particles.delete(node);
  if (node && node.parentNode) node.parentNode.removeChild(node);
}
function clearParticles(){
  particles.forEach(function(node){
    if (node && node.parentNode) node.parentNode.removeChild(node);
  });
  particles.clear();
}
// Улетающая цифра «+2» / «−3» рядом со счётом
function floater(text, color){
  var box = scoreEl.getBoundingClientRect();
  var el = document.createElement('div');
  el.className = 'floater';
  el.textContent = text;
  el.style.color = color;
  el.style.left = (box.left + box.width / 2) + 'px';
  el.style.top = (box.top) + 'px';
  document.body.appendChild(el);
  particles.add(el);
  try {
    var anim = el.animate([
      { transform: 'translate(-50%,0) scale(.6)', opacity: 0 },
      { transform: 'translate(-50%,-26px) scale(1.25)', opacity: 1, offset: 0.35 },
      { transform: 'translate(-50%,-78px) scale(1)', opacity: 0 }
    ], { duration: 1000, easing: 'cubic-bezier(0.68,-0.55,0.265,1.55)' });
    anim.onfinish = function(){ removeParticle(el); };
  } catch(e){
    later(function(){ removeParticle(el); }, 1000);
  }
}
// Праздничный фейерверк из нескольких залпов
function fireworks(){
  if (reduced()) return;
  var colors = ['#FFD93D', '#FF3D8B', '#4ECDC4', '#95E061', '#FF9F1C', '#FFDC5C'];
  for (var i = 0; i < 5; i++) {
    later(function(){
      var x = window.innerWidth * (0.18 + Math.random() * 0.64);
      var y = window.innerHeight * (0.18 + Math.random() * 0.5);
      burst(x, y, 26, colors, 240);
    }, i * 320);
  }
}

// ================================================================
// 4. HUD: счёт с «прокруткой», прогресс, раунд, история
// ================================================================
function animateScore(from, to){
  if (scoreRaf) { cancelAnimationFrame(scoreRaf); scoreRaf = 0; }
  var dur = 400, t0 = 0;
  function step(now){
    if (!t0) t0 = now;
    var t = Math.min(1, (now - t0) / dur);
    var eased = 1 - Math.pow(1 - t, 3);
    scoreEl.textContent = String(Math.round(from + (to - from) * eased));
    if (t < 1) { scoreRaf = requestAnimationFrame(step); }
    else { scoreEl.textContent = String(to); scoreRaf = 0; }
  }
  scoreRaf = requestAnimationFrame(step);

  scoreEl.classList.remove('bump', 'up', 'down');
  void scoreEl.offsetWidth;
  scoreEl.classList.add('bump', to >= from ? 'up' : 'down');
  later(function(){ scoreEl.classList.remove('bump', 'up', 'down'); }, 700);
}
function updateProgress(){
  var ratio = Math.max(0, Math.min(1, score / GOAL));
  barFillEl.style.transform = 'scaleX(' + ratio + ')';
  // Близко к цели — полоса начинает светиться
  if (score >= GOAL - 6 && score < GOAL) barEl.classList.add('near');
  else barEl.classList.remove('near');
}
function renderHistory(target, fresh){
  var box = target || historyEl;
  box.innerHTML = '';
  if (!betLog.length) {
    var empty = document.createElement('span');
    empty.className = 'dot-empty';
    empty.textContent = 'Пока пусто — впереди ' + TOTAL_ROUNDS + ' раундов';
    box.appendChild(empty);
    return;
  }
  for (var i = 0; i < betLog.length; i++) {
    var h = betLog[i];
    var dot = document.createElement('div');
    dot.className = 'dot ' + (h.ok ? 'win' : 'lose') + (h.bet === 3 ? ' b3' : '');
    dot.textContent = (h.ok ? '+' : '−') + h.bet;
    dot.title = 'Раунд ' + (i + 1) + ': ставка ' + h.bet + ', ' + (h.ok ? 'угадал' : 'мимо');
    if (fresh && i === betLog.length - 1) dot.classList.add('fresh');
    box.appendChild(dot);
  }
}
function renderHud(){
  roundNumEl.textContent = String(Math.max(1, round));
  roundMaxEl.textContent = String(TOTAL_ROUNDS);
}

// ================================================================
// 5. КОЛОДА ЗАДАНИЙ — никогда не выходим за границы массива
// ================================================================
function shuffled(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function drawQuestion(){
  if (!QUESTIONS.length) return { prompt: 'Список заданий пуст', answer: '—', hint: '' };
  if (!deck.length) {
    deck = shuffled(QUESTIONS);
    // Второй круг не должен начинаться с того же задания
    if (deck.length > 1 && lastPrompt !== null && deck[0].prompt === lastPrompt) {
      deck.push(deck.shift());
    }
  }
  var q = deck.shift();
  lastPrompt = q.prompt;
  return q;
}

// ================================================================
// 6. ХОД ИГРЫ
// ================================================================
function startGame(){
  clearTimers();
  clearParticles();
  if (scoreRaf) { cancelAnimationFrame(scoreRaf); scoreRaf = 0; }
  document.body.classList.remove('screen-shake', 'screen-shake-soft');
  shoutEl.classList.remove('show');
  shoutLayer.classList.remove('on');
  shoutEl.textContent = '';
  flashEl.classList.remove('on');
  modalBack.classList.remove('open');

  score = START_SCORE;
  round = 0;
  bet = 0;
  busy = false;
  phase = 'bet';   // снимаем 'over', иначе nextRound откажется стартовать
  betLog = [];
  deck = [];
  lastPrompt = null;
  current = null;

  scoreEl.textContent = String(score);
  scoreEl.classList.remove('bump', 'up', 'down');
  barEl.classList.remove('near');
  barFillEl.style.transform = 'scaleX(' + (score / GOAL) + ')';
  renderHistory(historyEl, false);
  nextRound();
}

function nextRound(){
  if (phase === 'over') return;
  round++;
  renderHud();
  current = drawQuestion();
  bet = 0;
  busy = false;
  phase = 'bet';

  // Показываем задание, прячем всё остальное
  taskTextEl.textContent = current.prompt;
  taskCardEl.classList.remove('pop');
  void taskCardEl.offsetWidth;
  taskCardEl.classList.add('pop');

  explainEl.hidden = true;
  nextRowEl.hidden = true;
  stageAnswerEl.hidden = true;
  suspenseEl.hidden = true;
  verdictRowEl.hidden = false;
  stageBetEl.hidden = false;
  setChipsEnabled(true);
  btnOk.disabled = false;
  btnNo.disabled = false;
}

function setChipsEnabled(on){
  var chips = document.querySelectorAll('.chip');
  for (var i = 0; i < chips.length; i++) chips[i].disabled = !on;
}

// Ставка сделана — фишки уходят, появляется вердикт учителя
function placeBet(n){
  if (phase !== 'bet' || busy) return;
  busy = true;
  bet = n;
  phase = 'answer';
  sndChip(n);
  setChipsEnabled(false);

  var chip = document.querySelector('.chip[data-bet="' + n + '"]');
  if (chip && !reduced()) {
    var box = chip.getBoundingClientRect();
    var colors = n === 3 ? ['#FF3D8B', '#FFDC5C', '#ff6fae'] : (n === 2 ? ['#FFD93D', '#FF9F1C'] : ['#4ECDC4', '#95E061']);
    burst(box.left + box.width / 2, box.top + box.height / 2, n === 3 ? 22 : (n === 2 ? 12 : 7), colors, n === 3 ? 200 : 130);
  }
  if (n === 3) flash('gold');   // тройка — золотая вспышка, но экран не перекрываем

  stageBetEl.hidden = true;
  stageAnswerEl.hidden = false;
  betBadgeEl.textContent = n === 3 ? 'ВА-БАНК! СТАВКА 3' : ('СТАВКА: ' + n);
  betBadgeEl.className = 'bet-badge' + (n === 3 ? ' b3' : '');
  void betBadgeEl.offsetWidth;  // перезапуск анимации влёта
  betBadgeEl.classList.add('pop');
  answerHintEl.textContent = n === 3
    ? 'Назад дороги нет. Скажи ответ вслух!'
    : 'Скажи ответ вслух! Учитель проверит.';

  later(function(){ busy = false; }, 260);
}

// Учитель нажал ✅ или ❌ — секунда ожидания перед исходом
function verdict(ok){
  if (phase !== 'answer' || busy) return;
  busy = true;
  phase = 'reveal';
  btnOk.disabled = true;
  btnNo.disabled = true;
  verdictRowEl.hidden = true;
  suspenseEl.hidden = false;
  sndSuspense();
  later(function(){ resolve(ok); }, 750);
}

// Раскрываем исход
function resolve(ok){
  suspenseEl.hidden = true;
  stageAnswerEl.hidden = true;

  var before = score;
  score += ok ? bet : -bet;
  betLog.push({ bet: bet, ok: ok });

  animateScore(before, score);
  updateProgress();
  renderHistory(historyEl, true);
  feedback(ok, bet);

  // Панель-объяснялка
  explainEl.hidden = false;
  explainEl.className = 'card explain ' + (ok ? 'good' : 'bad');
  explainVerdictEl.textContent = ok
    ? (bet === 3 ? 'ВА-БАНК ВЗЯТ! +3' : 'ВЕРНО! +' + bet)
    : (bet === 3 ? 'ОЙ… МИНУС ТРИ' : 'МИМО. −' + bet);
  explainAnswerEl.innerHTML = 'Правильно: <span></span>';
  explainAnswerEl.querySelector('span').textContent = current.answer;
  if (!ok && current.hint) {
    explainHintEl.hidden = false;
    explainHintEl.textContent = current.hint;
  } else {
    explainHintEl.hidden = true;
    explainHintEl.textContent = '';
  }

  // Чем кончился раунд для всей партии
  phase = 'result';
  if (score >= GOAL) { later(function(){ finish('win'); }, 1200); return; }
  if (score < 0)     { later(function(){ finish('bust'); }, 1200); return; }
  if (round >= TOTAL_ROUNDS) { later(function(){ finish('short'); }, 1200); return; }

  nextRowEl.hidden = false;
  btnNext.textContent = round === TOTAL_ROUNDS - 1 ? 'ПОСЛЕДНИЙ РАУНД →' : 'ДАЛЬШЕ →';
  busy = false;
}

// Отклик, громкость которого зависит от ставки
function feedback(ok, n){
  var cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  if (ok) {
    sndWin(n);
    floater('+' + n, '#95E061');
    if (n === 3) {
      shout('ВА-БАНК!', 'big', 'gold', 1300);
      flash('gold');
      shake(true);
      burst(cx, cy, 54, ['#FFDC5C', '#FFD93D', '#FF9F1C', '#fff3b0', '#FF3D8B'], 330);
    } else if (n === 2) {
      shout('ЕСТЬ!', 'mid', 'green', 850);
      shake(false);
      burst(cx, cy * 0.9, 20, ['#95E061', '#4ECDC4', '#FFD93D'], 190);
    } else {
      burst(cx, cy * 0.85, 8, ['#4ECDC4', '#95E061'], 120);
    }
  } else {
    sndLose(n);
    floater('−' + n, '#FF4444');
    if (n === 3) {
      shout('ОЙ!', 'big', 'red', 1300);
      flash('red');
      shake(true);
      burst(cx, cy, 44, ['#FF4444', '#c01414', '#FF9F1C'], 300);
    } else if (n === 2) {
      shout('МИМО', 'mid', 'red', 800);
      shake(false);
    } else {
      flash('red');
    }
  }
}

// ================================================================
// 7. ФИНАЛ ПАРТИИ + СТАТИСТИКА РИСКА
// ================================================================
// Русские окончания: 1 раз, 2 раза, 5 раз, 11 раз, 22 раза
function plural(n, one, few, many){
  var d10 = n % 10, d100 = n % 100;
  if (d10 === 1 && d100 !== 11) return one;
  if (d10 >= 2 && d10 <= 4 && (d100 < 12 || d100 > 14)) return few;
  return many;
}
function statsLine(){
  var maxBet = 0, threes = 0, threeWins = 0;
  for (var i = 0; i < betLog.length; i++) {
    var h = betLog[i];
    if (h.bet > maxBet) maxBet = h.bet;
    if (h.bet === 3) { threes++; if (h.ok) threeWins++; }
  }
  var left = 'Самая смелая ставка: ' + (maxBet || '—');
  var right = threes
    ? ('Угадал на тройке: ' + threeWins + ' ' + plural(threeWins, 'раз', 'раза', 'раз') + ' из ' + threes)
    : 'На тройку так и не решился';
  return left + ' · ' + right;
}

function finish(kind){
  phase = 'over';
  busy = true;
  nextRowEl.hidden = true;
  stageBetEl.hidden = true;
  stageAnswerEl.hidden = true;

  if (kind === 'win') {
    modalTitle.textContent = 'ТЫ СДЕЛАЛ ЭТО!';
    modalTitle.className = 'win';
    modalSub.textContent = 'Тридцать очков — и ты сам решал, когда рисковать.';
    sndFanfare();
    shout('ПОБЕДА!', 'big', 'gold', 1500);
    fireworks();
    shake(true);
  } else if (kind === 'bust') {
    modalTitle.textContent = 'ОБНУЛИЛСЯ!';
    modalTitle.className = 'bust';
    modalSub.textContent = 'Бывает: рискнул — не зашло. Правила теперь знаешь лучше, чем в начале.';
    sndSoftEnd();
  } else {
    modalTitle.textContent = 'ЧУТЬ-ЧУТЬ НЕ ХВАТИЛО!';
    modalTitle.className = 'soft';
    modalSub.textContent = 'В следующий раз рискни на тех, где точно знаешь.';
    sndSoftEnd();
  }

  modalScore.textContent = 'Очки: ' + score + ' из ' + GOAL;
  modalStats.textContent = statsLine();
  renderHistory(modalHistory, false);
  later(function(){ modalBack.classList.add('open'); }, kind === 'win' ? 700 : 400);
}

// ================================================================
// 8. СОБЫТИЯ И ЗАПУСК
// ================================================================
var chipButtons = document.querySelectorAll('.chip');
for (var ci = 0; ci < chipButtons.length; ci++) {
  (function(btn){
    btn.addEventListener('click', function(){ placeBet(parseInt(btn.getAttribute('data-bet'), 10)); });
  })(chipButtons[ci]);
}
btnOk.addEventListener('click', function(){ verdict(true); });
btnNo.addEventListener('click', function(){ verdict(false); });
btnNext.addEventListener('click', function(){
  if (phase !== 'result' || busy) return;
  busy = true;
  sndClick();
  nextRound();
});
btnAgain.addEventListener('click', function(){
  sndClick();
  phase = 'bet';
  startGame();
});
soundBtn.addEventListener('click', function(){
  soundOn = !soundOn;
  updateSoundBtn();
  try { localStorage.setItem('vabank-sound', soundOn ? 'on' : 'off'); } catch(e){}
  if (soundOn) sndClick();
});

updateSoundBtn();
renderHud();
startGame();
</script>
