<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Проявление — немецкий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ПАЛИТРА И БАЗА
   ============================================================ */
:root {
  --bg:#1a1240; --bg-2:#2d1b69; --yellow:#FFD93D; --pink:#FF3D8B;
  --cyan:#4ECDC4; --green:#95E061; --orange:#FF9F1C; --red:#FF4444;
  --gold:#FFDC5C; --ink:#14102b;
  --title-font: 'Bangers', 'Impact', 'Haettenschweiler', system-ui, sans-serif;
  --text-font: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  overflow-x: hidden;
  overflow-x: clip;
  margin: 0;
  padding: 0;
  width: 100%;
  max-width: 100%;
}

body {
  min-height: 100vh;
  font-family: var(--text-font);
  color: #fff;
  background:
    radial-gradient(circle at 12% 18%, rgba(78,205,196,.30), transparent 45%),
    radial-gradient(circle at 88% 12%, rgba(255,61,139,.26), transparent 42%),
    radial-gradient(circle at 50% 96%, rgba(255,217,61,.20), transparent 48%),
    linear-gradient(135deg, var(--bg), var(--bg-2));
  background-attachment: fixed;
  padding: clamp(10px, 2.4vw, 26px) clamp(8px, 2vw, 22px) 40px;
}

/* Полутоновая сетка поверх фона */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,.06) 1px, transparent 1px);
  background-size: 22px 22px;
  pointer-events: none;
  z-index: 1;
}

.wrap {
  position: relative;
  z-index: 2;
  max-width: 1180px;
  margin: 0 auto;
}

/* ============================================================
   ШАПКА
   ============================================================ */
.title {
  font-family: var(--title-font);
  font-size: clamp(1.9rem, 8vw, 5.6rem);
  letter-spacing: clamp(1px, .55vw, 3px);
  text-align: center;
  margin: 6px 0 2px;
  transform: rotate(-2deg);
  background: linear-gradient(180deg, #fff 6%, var(--cyan) 42%, var(--gold) 96%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(4px 4px 0 var(--ink));
  line-height: 1.05;
}

.subtitle {
  text-align: center;
  font-size: clamp(.85rem, 2.4vw, 1.05rem);
  color: #d9d2ff;
  margin: 4px auto 16px;
  max-width: 40ch;
  line-height: 1.4;
}

/* ============================================================
   КНОПКА ЗВУКА
   ============================================================ */
.sound-btn {
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 120;
  width: 52px;
  height: 52px;
  min-width: 44px;
  min-height: 44px;
  font-size: 1.5rem;
  line-height: 1;
  cursor: pointer;
  border: 4px solid var(--ink);
  border-radius: 16px;
  background: var(--cyan);
  color: var(--ink);
  box-shadow: 5px 5px 0 var(--ink);
  transition: transform .12s ease, box-shadow .12s ease;
}
.sound-btn:hover { transform: translate(-3px,-3px); box-shadow: 8px 8px 0 var(--ink); }
.sound-btn:active { transform: translate(4px,4px); box-shadow: 2px 2px 0 var(--ink); }

/* ============================================================
   СЦЕНА: КАРТИНКА + ИГРА
   ============================================================ */
.stage {
  display: flex;
  flex-wrap: wrap;
  gap: clamp(14px, 3vw, 30px);
  justify-content: center;
  align-items: flex-start;
}

.pic-col { flex: 1 1 360px; max-width: 580px; min-width: 0; width: 100%; }
.play-col { flex: 1 1 340px; max-width: 500px; min-width: 0; width: 100%; }

/* --- рамка с картинкой --- */
.frame {
  --glow: 0;
  position: relative;
  width: 100%;
  aspect-ratio: 5 / 4;
  border: 5px solid var(--ink);
  border-radius: 20px;
  overflow: hidden;
  transform: rotate(-1deg);
  box-shadow:
    6px 6px 0 var(--ink),
    0 0 calc(var(--glow) * 1.1px) calc(var(--glow) * .28px) rgba(255,220,92,.55),
    0 0 calc(var(--glow) * 2px) rgba(78,205,196,.35);
  transition: box-shadow .5s ease;
  background: #0c0a1f;
}

/* --- сама картинка (собирается из эмодзи) --- */
.pic {
  position: absolute;
  inset: 0;
  overflow: hidden;
  display: block;
}
.pic::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 45%, transparent 42%, rgba(0,0,0,.30) 100%);
  pointer-events: none;
}
.pic-main {
  position: absolute;
  left: 50%;
  top: 52%;
  transform: translate(-50%,-50%) rotate(-3deg);
  font-size: calc(var(--u, 4px) * 40);
  line-height: 1;
  filter: drop-shadow(0 calc(var(--u,4px) * 1.4) calc(var(--u,4px) * 1.6) rgba(0,0,0,.45));
  user-select: none;
}
.pic-bit {
  position: absolute;
  line-height: 1;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,.35));
  user-select: none;
}

/* --- слой плиток --- */
.tiles {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(4, 1fr);
  z-index: 3;
}
.tile {
  --r: 0deg;
  border: 3px solid var(--ink);
  border-radius: 5px;
  transform: rotate(var(--r)) scale(1.08);
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.22), inset 0 -8px 14px rgba(0,0,0,.18);
  background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.07) 0 9px, rgba(255,255,255,.05) 9px 18px);
  will-change: transform, opacity, filter;
}

/* Плитка растворяется: вспышка по контуру → размытие → ничего */
@keyframes dissolve {
  0%   { opacity:1; filter: blur(0px);
         transform: rotate(var(--r)) scale(1.08);
         box-shadow: inset 0 0 0 3px rgba(255,255,255,.22), 0 0 0 0 rgba(255,255,255,0); }
  20%  { opacity:1; filter: blur(.6px);
         transform: rotate(calc(var(--r) + 3deg)) scale(1.13);
         box-shadow: inset 0 0 16px 4px rgba(255,255,255,.9), 0 0 22px 7px rgba(255,255,255,.85); }
  100% { opacity:0; filter: blur(15px);
         transform: rotate(calc(var(--r) + 15deg)) scale(1.5);
         box-shadow: inset 0 0 0 0 rgba(255,255,255,0), 0 0 34px 12px rgba(255,255,255,0); }
}
.tile.gone { animation: dissolve .6s ease-out forwards; pointer-events: none; }

/* Плитка влетает обратно */
@keyframes tileback {
  0%   { opacity:0; filter: blur(18px); transform: rotate(calc(var(--r) - 55deg)) scale(2.5); }
  55%  { opacity:1; filter: blur(0px);  transform: rotate(calc(var(--r) + 7deg)) scale(.9); }
  100% { opacity:1; filter: blur(0px);  transform: rotate(var(--r)) scale(1.08); }
}
.tile.back { animation: tileback .55s cubic-bezier(0.68,-0.55,0.265,1.55) forwards; }

/* Разлёт веером в момент победы */
@keyframes fanout {
  0%   { opacity:1; transform: rotate(var(--r)) scale(1.08); filter: blur(0px); }
  100% { opacity:0; filter: blur(8px);
         transform: translate(var(--fx), var(--fy)) rotate(var(--fr)) scale(.45); }
}
.tile.fan { animation: fanout .9s cubic-bezier(.18,.62,.3,1) forwards; pointer-events:none; }

/* --- строка состояния под картинкой --- */
.statusline {
  margin-top: 12px;
  text-align: center;
  font-family: var(--title-font);
  font-size: clamp(1rem, 3.2vw, 1.35rem);
  letter-spacing: 1.5px;
  color: var(--cyan);
  text-shadow: 2px 2px 0 var(--ink);
}
.statusline b { color: var(--gold); }

/* ============================================================
   КАРТОЧКА ВОПРОСА
   ============================================================ */
.card {
  background: #241a55;
  border: 5px solid var(--ink);
  border-radius: 22px;
  box-shadow: 6px 6px 0 var(--ink);
  padding: clamp(14px, 3vw, 22px);
  transform: rotate(1deg);
}
.q-label {
  font-family: var(--title-font);
  letter-spacing: 2px;
  font-size: clamp(.95rem, 3vw, 1.2rem);
  color: var(--pink);
  text-shadow: 2px 2px 0 var(--ink);
  margin-bottom: 6px;
}
.q-prompt {
  font-family: var(--title-font);
  font-size: clamp(1.5rem, 5.4vw, 2.4rem);
  letter-spacing: 1.5px;
  color: var(--yellow);
  text-shadow: 3px 3px 0 var(--ink);
  line-height: 1.15;
  margin-bottom: 14px;
  word-break: break-word;
}
.opts { display: flex; flex-direction: column; gap: 10px; }

.opt {
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  font-family: var(--text-font);
  font-weight: 700;
  font-size: clamp(1rem, 3.6vw, 1.3rem);
  color: var(--ink);
  background: #fff;
  border: 4px solid var(--ink);
  border-radius: 16px;
  box-shadow: 6px 6px 0 var(--ink);
  cursor: pointer;
  text-align: left;
  transition: transform .12s ease, box-shadow .12s ease, background .2s ease;
  transform: rotate(-.6deg);
}
.opt:nth-child(even) { transform: rotate(.7deg); }
.opt:hover:not(:disabled) { transform: translate(-3px,-3px); box-shadow: 9px 9px 0 var(--ink); }
.opt:active:not(:disabled) { transform: translate(4px,4px); box-shadow: 2px 2px 0 var(--ink); }
.opt:disabled { cursor: default; }
.opt.chosen { background: var(--cyan); animation: waiting .6s ease-in-out infinite alternate; }
@keyframes waiting { from { filter: brightness(1); } to { filter: brightness(1.25); } }
.opt.right { background: var(--green); }
.opt.wrong { background: var(--red); color: #fff; }
.opt.fade { opacity: .45; }

.hint {
  margin-top: 12px;
  font-size: clamp(.85rem, 2.7vw, 1rem);
  line-height: 1.45;
  color: #ffe9a8;
  background: rgba(0,0,0,.28);
  border-radius: 12px;
  padding: 0 12px;
  max-height: 0;
  overflow: hidden;
  transition: max-height .35s ease, padding .35s ease;
}
.hint.show { max-height: 260px; padding: 10px 12px; }

/* ============================================================
   КНОПКА «Я ЗНАЮ!»
   ============================================================ */
.know-btn {
  display: block;
  width: 100%;
  margin-top: 16px;
  min-height: 66px;
  padding: 14px 16px;
  font-family: var(--title-font);
  font-size: clamp(1.4rem, 5vw, 2.1rem);
  letter-spacing: 2px;
  color: var(--ink);
  background: linear-gradient(160deg, #FFF3B0, var(--gold) 45%, var(--orange));
  border: 5px solid var(--ink);
  border-radius: 20px;
  box-shadow: 6px 6px 0 var(--ink);
  cursor: pointer;
  transform: rotate(-1.4deg);
  transition: transform .12s ease, box-shadow .12s ease;
}
.know-btn:hover:not(:disabled) { transform: translate(-3px,-3px) rotate(-1.4deg); box-shadow: 9px 9px 0 var(--ink); }
.know-btn:active:not(:disabled) { transform: translate(4px,4px) rotate(-1.4deg); box-shadow: 2px 2px 0 var(--ink); }
.know-btn:disabled { opacity: .55; cursor: default; }
.know-btn .pts {
  display: block;
  font-family: var(--text-font);
  font-weight: 700;
  font-size: clamp(.85rem, 2.8vw, 1.05rem);
  letter-spacing: 0;
  margin-top: 2px;
  color: #4a3200;
}
.know-btn .pts span { display: inline-block; }
.know-btn .pts span.tick { animation: tick .35s ease; }
@keyframes tick {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.35) rotate(-4deg); color: var(--red); }
  100% { transform: scale(1); }
}
/* Мягкая пульсация: самый выгодный момент рискнуть */
@keyframes attract {
  0%,100% { box-shadow: 6px 6px 0 var(--ink), 0 0 0 0 rgba(255,220,92,.55); }
  50%     { box-shadow: 6px 6px 0 var(--ink), 0 0 32px 12px rgba(255,220,92,.55); }
}
.know-btn.pulse { animation: attract 1.6s ease-in-out infinite; }

/* ============================================================
   МОДАЛКИ
   ============================================================ */
.modal-back {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(10,7,30,.82);
  backdrop-filter: blur(3px);
}
.modal-back.show { display: flex; }
.modal {
  width: min(560px, 100%);
  max-height: 92vh;
  overflow-y: auto;
  background: linear-gradient(160deg, #2d1b69, #1a1240);
  border: 5px solid var(--ink);
  border-radius: 22px;
  box-shadow: 6px 6px 0 var(--ink);
  padding: clamp(16px, 4vw, 28px);
  text-align: center;
  transform: rotate(-1deg);
  animation: pop .45s cubic-bezier(0.68,-0.55,0.265,1.55);
}
@keyframes pop {
  0%   { transform: rotate(-1deg) scale(.55); opacity: 0; }
  100% { transform: rotate(-1deg) scale(1); opacity: 1; }
}
.modal h2 {
  font-family: var(--title-font);
  font-size: clamp(1.8rem, 7vw, 3rem);
  letter-spacing: 2px;
  margin: 0 0 8px;
  color: var(--gold);
  text-shadow: 4px 4px 0 var(--ink);
  line-height: 1.1;
}
.modal p { font-size: clamp(.95rem, 3vw, 1.15rem); line-height: 1.5; margin: 8px 0; }
.modal-btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 18px; }

.btn {
  min-height: 56px;
  padding: 12px 22px;
  font-family: var(--title-font);
  font-size: clamp(1.1rem, 4vw, 1.6rem);
  letter-spacing: 1.5px;
  color: var(--ink);
  border: 5px solid var(--ink);
  border-radius: 18px;
  box-shadow: 6px 6px 0 var(--ink);
  cursor: pointer;
  transition: transform .12s ease, box-shadow .12s ease;
}
.btn:hover { transform: translate(-3px,-3px); box-shadow: 9px 9px 0 var(--ink); }
.btn:active { transform: translate(4px,4px); box-shadow: 2px 2px 0 var(--ink); }
.btn-yes { background: var(--green); }
.btn-no  { background: var(--red); color: #fff; }
.btn-again { background: var(--gold); }
.btn-mini {
  margin-top: 14px;
  background: none;
  border: none;
  box-shadow: none;
  color: #b9aee8;
  font-family: var(--text-font);
  font-size: .95rem;
  text-decoration: underline;
  cursor: pointer;
  min-height: 44px;
}
.btn-mini:hover { transform: none; box-shadow: none; color: #fff; }
.btn-mini:active { transform: none; box-shadow: none; }

.teacher {
  margin-top: 16px;
  font-size: .82rem;
  line-height: 1.4;
  color: #a99ee0;
  border-top: 2px dashed rgba(255,255,255,.2);
  padding-top: 10px;
}
.teacher b { color: var(--cyan); }

/* Финальная панель */
.final-name {
  font-family: var(--title-font);
  font-size: clamp(1.8rem, 7vw, 3rem);
  letter-spacing: 2px;
  color: #fff;
  text-shadow: 3px 3px 0 var(--ink);
  line-height: 1.1;
}
.final-de {
  font-family: var(--title-font);
  font-size: clamp(1.3rem, 5vw, 2.1rem);
  letter-spacing: 2px;
  color: var(--cyan);
  text-shadow: 3px 3px 0 var(--ink);
  margin-bottom: 10px;
}
.final-score {
  font-family: var(--title-font);
  font-size: clamp(3rem, 13vw, 5.5rem);
  line-height: 1;
  letter-spacing: 3px;
  background: linear-gradient(180deg, #fff, var(--gold) 55%, var(--orange));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(4px 4px 0 var(--ink));
  margin: 6px 0 0;
}
.final-emoji { font-size: clamp(3rem, 12vw, 5rem); line-height: 1; }
.final-note { color: #ffe9a8; }

/* ============================================================
   ЭФФЕКТЫ: ВОЛНА СВЕТА, ИСКРЫ, ПОКАЗ КАРТИНКИ, ПЛАШКА
   ============================================================ */
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }

.wave-ring {
  position: fixed;
  left: 50%; top: 50%;
  width: 22vmax; height: 22vmax;
  margin: -11vmax 0 0 -11vmax;
  border-radius: 50%;
  border: 10px solid rgba(255,220,92,.5);
  box-shadow: 0 0 90px 30px rgba(255,220,92,.30), inset 0 0 70px rgba(255,255,255,.30);
  pointer-events: none;
  z-index: 65;
}
@keyframes wave {
  0%   { transform: scale(.05); opacity: 0; }
  18%  { opacity: 1; }
  100% { transform: scale(3.4); opacity: 0; }
}
.wave-ring.go { animation: wave 1.4s ease-out forwards; }

.spark {
  position: absolute;
  left: 50%; top: 50%;
  width: 14px; height: 14px;
  border-radius: 50%;
  pointer-events: none;
}
@keyframes sparkfly {
  0%   { transform: translate(-50%,-50%) scale(.35); opacity: 1; }
  70%  { opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0); opacity: 0; }
}
.spark.go { animation: sparkfly var(--dur, 1.1s) cubic-bezier(.15,.7,.35,1) forwards; }

/* Показ картинки во весь экран */
.reveal {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px;
  background: rgba(10,7,30,.92);
  opacity: 0;
  transition: opacity .5s ease;
}
.reveal.show { display: flex; opacity: 1; }
.reveal-frame {
  position: relative;
  width: min(86vw, 80vh);
  aspect-ratio: 5 / 4;
  border: 5px solid var(--ink);
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 6px 6px 0 var(--ink), 0 0 70px 18px rgba(255,220,92,.45);
  transform: rotate(-1deg) scale(.85);
  transition: transform .7s cubic-bezier(0.68,-0.55,0.265,1.55);
}
.reveal.show .reveal-frame { transform: rotate(-1deg) scale(1); }
.reveal-ru {
  font-family: var(--title-font);
  font-size: clamp(2.4rem, 11vw, 6rem);
  letter-spacing: 3px;
  line-height: 1;
  color: var(--gold);
  -webkit-text-stroke: 3px var(--ink);
  text-shadow: 5px 5px 0 var(--ink);
  text-align: center;
}
.reveal-de {
  font-family: var(--title-font);
  font-size: clamp(1.4rem, 6vw, 3rem);
  letter-spacing: 2px;
  line-height: 1;
  color: var(--cyan);
  -webkit-text-stroke: 2px var(--ink);
  text-shadow: 4px 4px 0 var(--ink);
  text-align: center;
}

/* Небольшая плашка «Ещё рано…» */
.toast {
  position: fixed;
  left: 50%;
  top: 16%;
  transform: translate(-50%, -14px);
  z-index: 95;
  padding: 12px 22px;
  font-family: var(--title-font);
  font-size: clamp(1.2rem, 4.5vw, 1.9rem);
  letter-spacing: 2px;
  color: #fff;
  background: #3a2470;
  border: 5px solid var(--ink);
  border-radius: 18px;
  box-shadow: 6px 6px 0 var(--ink);
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s ease, transform .3s ease;
  max-width: 90vw;
  text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ============================================================
   ЩАДЯЩИЙ РЕЖИМ АНИМАЦИЙ
   ============================================================ */
/* На узких экранах кнопка звука не должна наезжать на заголовок */
@media (max-width: 460px) {
  .sound-btn { width: 44px; height: 44px; font-size: 1.2rem; border-width: 3px; border-radius: 13px; }
  .wrap { padding-top: 50px; }
  .title { font-size: clamp(1.8rem, 7.2vw, 3rem); margin-top: 2px; }
}

@media (prefers-reduced-motion: reduce) {
  .tile.gone { animation: none; opacity: 0; visibility: hidden; }
  .tile.back { animation: none; opacity: 1; visibility: visible; }
  .tile.fan  { animation: none; opacity: 0; visibility: hidden; }
  .spark, .wave-ring { display: none !important; }
  .know-btn.pulse { animation: none; outline: 4px solid rgba(255,220,92,.8); outline-offset: 4px; }
  .modal { animation: none; }
  .opt.chosen { animation: none; }
  .reveal-frame { transition: none; transform: rotate(-1deg) scale(1); }
  .know-btn .pts span.tick { animation: none; }
}
</style>
</head>
<body>

<button class="sound-btn" id="soundBtn" aria-label="Звук">🔊</button>

<div class="wrap">
  <h1 class="title">ПРОЯВЛЕНИЕ</h1>
  <p class="subtitle">Отвечай правильно — плитки тают, картинка проступает. Догадался раньше — очков больше.</p>

  <div class="stage">
    <!-- Левая колонка: картинка под плитками -->
    <div class="pic-col">
      <div class="frame" id="frame">
        <div class="pic" id="pic"></div>
        <div class="tiles" id="tiles"></div>
      </div>
      <div class="statusline" id="statusLine">Открыто <b>0</b> из 20</div>
    </div>

    <!-- Правая колонка: вопрос и кнопка догадки -->
    <div class="play-col">
      <div class="card">

/* ============================================================
   ПОСТОЯННЫЕ И СЛУЖЕБНОЕ
   ============================================================ */
const COLS = 5, ROWS = 4, TILE_COUNT = COLS * ROWS;
const POINT_PER_TILE = 10;   // очков за каждую оставшуюся закрытой плитку
const MISS_PENALTY = 30;     // штраф за неверную догадку
const TILE_COLORS = ['--yellow', '--pink', '--cyan', '--green', '--orange', '--gold'];

// Позиции мелких эмодзи-деталей: x/y в % от картинки, s — размер в единицах --u, r — поворот
const BIT_SLOTS = [
  {x: 11, y: 17, s: 11, r: -13},
  {x: 87, y: 14, s: 9,  r: 14},
  {x: 16, y: 79, s: 12, r: 8},
  {x: 86, y: 76, s: 10, r: -10},
  {x: 50, y: 12, s: 8,  r: 6},
  {x: 7,  y: 49, s: 9,  r: -6},

  {x: 44, y: 90, s: 9,  r: -8}
];

// Звуковая лестница: полутона для 20 плиток (мягко ползёт вверх)
const LADDER = [0, 2, 4, 7, 9, 11, 12, 14, 16, 17, 19, 21, 23, 24, 26, 28, 29, 31, 33, 35];

const REDUCED = (function () {
  try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  catch (e) { return false; }
})();

// Все таймеры живут тут — чтобы рестарт мог их вычистить
const timers = new Set();
function later(fn, ms) {
  const id = setTimeout(function () { timers.delete(id); fn(); }, ms);
  timers.add(id);
  return id;
}
function clearTimers() {
  timers.forEach(function (id) { clearTimeout(id); });
  timers.clear();
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ============================================================
   ЗВУК — Web Audio, контекст создаётся лениво по первому жесту
   ============================================================ */
let actx = null;
let soundOn = true;
try { soundOn = localStorage.getItem('proyavlenie-sound') !== 'off'; } catch (e) { soundOn = true; }

function ac() {
  if (!soundOn) return null;
  try {
    if (!actx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      actx = new C();
    }
    if (actx.state === 'suspended' && actx.resume) actx.resume();
    return actx;
  } catch (e) { return null; }
}

function tone(freq, dur, o) {
  o = o || {};
  const ctx = ac();
  if (!ctx) return;
  try {
    const t0 = ctx.currentTime + (o.delay || 0);
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(24, o.to), t0 + dur);
    const vol = (o.vol == null) ? 0.16 : o.vol;
    const atk = (o.attack == null) ? 0.02 : o.attack;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.06);
  } catch (e) { /* без звука играть тоже можно */ }
}

function noise(dur, o) {
  o = o || {};
  const ctx = ac();
  if (!ctx) return;
  try {
    const n = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const f = ctx.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = o.hp || 1000;
    const g = ctx.createGain();
    g.gain.value = o.vol == null ? 0.10 : o.vol;
    src.connect(f); f.connect(g); g.connect(ctx.destination);
    src.start();
  } catch (e) { /* тишина — не беда */ }
}

// Нейтральный клик
function sClick() { tone(520, 0.09, {type: 'triangle', vol: 0.10}); }

// Тихий «дзинь» открывшейся плитки: тон повышается с каждой следующей
function sTile(n) {
  const semi = LADDER[Math.min(n, LADDER.length - 1)];
  const f = 233 * Math.pow(2, semi / 12);
  const v = Math.max(0.07, 0.15 - n * 0.003);
  tone(f, 0.55, {type: 'sine', vol: v, attack: 0.008});
  tone(f * 2, 0.28, {type: 'sine', vol: v * 0.35, attack: 0.005, delay: 0.01});
  tone(f / 2, 0.7, {type: 'sine', vol: v * 0.30, attack: 0.03});
}

// Неверный ответ на задание — мягко вниз
function sMiss() {
  tone(233, 0.30, {type: 'sine', to: 155, vol: 0.14});
}

// Неверная догадка — короткий «пшик» и низкий тон
function sPshik() {
  noise(0.18, {hp: 1300, vol: 0.09});
  tone(175, 0.55, {type: 'sine', to: 88, vol: 0.15, attack: 0.03});
}

// Победа — мягкий восходящий аккорд
function sWin() {
  const base = 392;
  const steps = [0, 4, 7, 12, 16, 19];
  for (let i = 0; i < steps.length; i++) {
    tone(base * Math.pow(2, steps[i] / 12), 1.0, {
      type: 'triangle', vol: 0.11, attack: 0.05, delay: i * 0.11
    });
  }
  tone(base / 2, 1.9, {type: 'sine', vol: 0.09, attack: 0.25});
}

// Финальный фанфар — тоже негромкий, игра тихая
function sFanfare() {
  const base = 523.25;
  const steps = [0, 7, 12, 16, 19, 24];
  for (let i = 0; i < steps.length; i++) {
    tone(base * Math.pow(2, steps[i] / 12), 0.8, {
      type: 'sine', vol: 0.10, attack: 0.03, delay: i * 0.09
    });
  }
  tone(base / 4, 1.6, {type: 'triangle', vol: 0.07, attack: 0.2, delay: 0.1});
}

const state = {

  tiles: [],

/* ============================================================

   ============================================================ */
function sizePic(el) {
  const w = el.clientWidth || el.offsetWidth || 320;
  el.style.setProperty('--u', (w / 100) + 'px');
}

function buildPicture(el, pic) {
  el.innerHTML = '';
  el.style.background = pic.bg;
  const main = document.createElement('div');
  main.className = 'pic-main';
  main.textContent = pic.emoji;
  el.appendChild(main);
  for (let i = 0; i < pic.bits.length && i < BIT_SLOTS.length; i++) {
    const slot = BIT_SLOTS[i];
    const b = document.createElement('div');
    b.className = 'pic-bit';
    b.textContent = pic.bits[i];
    b.style.left = slot.x + '%';
    b.style.top = slot.y + '%';
    b.style.fontSize = 'calc(var(--u, 4px) * ' + slot.s + ')';
    b.style.transform = 'translate(-50%,-50%) rotate(' + slot.r + 'deg)';
    el.appendChild(b);
  }
  sizePic(el);
}

function resizeAllPics() {
  sizePic(picEl);
  sizePic(revealPic);
}
window.addEventListener('resize', resizeAllPics);
window.addEventListener('orientationchange', function () { later(resizeAllPics, 220); });

/* ============================================================
   СБОРКА ПЛИТОК
   ============================================================ */
function buildTiles() {
  tilesEl.innerHTML = '';
  state.tiles = [];
  for (let i = 0; i < TILE_COUNT; i++) {
    const row = Math.floor(i / COLS);
    const col = i % COLS;
    const t = document.createElement('div');
    t.className = 'tile';
    const r = ((i % 2) ? 1 : -1) * (0.8 + (i % 3) * 0.55);
    t.style.setProperty('--r', r.toFixed(2) + 'deg');
    t.style.background = 'var(' + TILE_COLORS[(row * 2 + col * 3) % TILE_COLORS.length] + ')';
    tilesEl.appendChild(t);
    state.tiles.push(t);
  }
  state.order = shuffle(state.tiles.map(function (_, i) { return i; }));
}

/* ============================================================
   ОЧКИ, СВЕЧЕНИЕ, СТРОКА СОСТОЯНИЯ
   ============================================================ */
function closedCount() { return TILE_COUNT - state.opened; }

function potential() {
  return Math.max(0, closedCount() * POINT_PER_TILE - state.misses * MISS_PENALTY);
}

function refreshMeters(animateNumber) {
  const p = potential();
  if (knowPts.textContent !== String(p)) {
    knowPts.textContent = String(p);
    if (animateNumber && !REDUCED) {
      knowPts.classList.remove('tick');
      void knowPts.offsetWidth;
      knowPts.classList.add('tick');
    }
  }
  statusLine.innerHTML = 'Открыто <b>' + state.opened + '</b> из ' + TILE_COUNT +
    ' · закрыто <b>' + closedCount() + '</b>';
  // Чем меньше плиток осталось — тем сильнее свечение вокруг сетки
  frameEl.style.setProperty('--glow', String(Math.round((state.opened / TILE_COUNT) * 75)));
  // Кнопка притягивает сильнее всего, когда открыто 3–8 плиток
  const hot = !state.over && state.opened >= 3 && state.opened <= 8;
  knowBtn.classList.toggle('pulse', hot);
  askStake.textContent = 'Верная догадка сейчас — ' + p + ' очков.';
}

/* ============================================================
   ОТКРЫТИЕ И ВОЗВРАТ ПЛИТОК
   ============================================================ */
function openTile() {
  if (state.opened >= TILE_COUNT) return;
  const idx = state.order[state.opened];
  const t = state.tiles[idx];
  state.opened++;
  if (t) {
    t.classList.remove('back');
    void t.offsetWidth;
    t.classList.add('gone');
  }
  sTile(state.opened - 1);
  refreshMeters(true);
}

function returnTiles(n) {
  let back = 0;
  for (let i = 0; i < n && state.opened > 0; i++) {
    state.opened--;
    const idx = state.order[state.opened];
    const t = state.tiles[idx];
    if (t) {
      t.classList.remove('gone');
      void t.offsetWidth;
      t.classList.add('back');
      const el = t;
      later(function () { el.classList.remove('back'); }, 620);
    }
    back++;
  }
  refreshMeters(true);
  return back;
}

/* ============================================================
   ЭФФЕКТЫ
   ============================================================ */
function lightWave() {
  if (REDUCED) return;
  for (let k = 0; k < 2; k++) {
    later(function () {
      const ring = document.createElement('div');
      ring.className = 'wave-ring';
      document.body.appendChild(ring);
      void ring.offsetWidth;
      ring.classList.add('go');
      const kill = function () { if (ring.parentNode) ring.parentNode.removeChild(ring); };
      ring.addEventListener('animationend', kill);
      later(kill, 1800);
    }, k * 260);
  }
}

function sparks(count) {
  if (REDUCED) return;
  const colors = ['#FFDC5C', '#FFD93D', '#FF9F1C', '#FFFFFF', '#4ECDC4'];
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    const ang = (Math.PI * 2 * i) / count + Math.random() * 0.4;
    const dist = 140 + Math.random() * 320;
    const size = 8 + Math.random() * 14;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.background = colors[i % colors.length];
    s.style.boxShadow = '0 0 14px ' + colors[i % colors.length];
    s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
    s.style.setProperty('--dur', (0.9 + Math.random() * 0.7).toFixed(2) + 's');
    fxEl.appendChild(s);
    void s.offsetWidth;
    s.classList.add('go');
    const kill = function () { if (s.parentNode) s.parentNode.removeChild(s); };
    s.addEventListener('animationend', kill);
    later(kill, 2200);
  }
}

function showToast(text, ms) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  later(function () { toastEl.classList.remove('show'); }, ms || 1600);
}

/* ============================================================
   ВОПРОСЫ
   ============================================================ */
function refillQueue() {
  if (!QUESTIONS.length) { state.queue = []; return; }
  let q = shuffle(QUESTIONS);
  // Чтобы одно и то же задание не повторилось встык на новом круге
  if (q.length > 1 && q[0].prompt === state.lastPrompt) {
    const t = q[0]; q[0] = q[q.length - 1]; q[q.length - 1] = t;
  }
  state.queue = q;
}

function nextQuestion() {
  if (!QUESTIONS.length) {
    qPrompt.textContent = 'Список заданий пуст';
    optsEl.innerHTML = '';
    return;
  }
  if (!state.queue.length) refillQueue();
  state.current = state.queue.shift();
  state.lastPrompt = state.current.prompt;
  qPrompt.textContent = state.current.prompt;
  hintEl.textContent = '';
  hintEl.classList.remove('show');
  renderOptions(state.current);
}

// Варианты ответа: правильный + похожие из банка (сначала с тем же местоимением)
function makeOptions(q) {
  const wanted = 3;
  const pron = String(q.answer).split(' ')[0];
  const pool = [];
  for (let i = 0; i < QUESTIONS.length; i++) {
    const a = QUESTIONS[i].answer;
    if (a !== q.answer && pool.indexOf(a) < 0) pool.push(a);
  }
  const near = shuffle(pool.filter(function (a) { return a.split(' ')[0] === pron; }));
  const far = shuffle(pool.filter(function (a) { return a.split(' ')[0] !== pron; }));
  const src = near.concat(far);
  const out = [q.answer];
  for (let i = 0; i < src.length && out.length < wanted; i++) {
    if (out.indexOf(src[i]) < 0) out.push(src[i]);
  }
  return shuffle(out);
}

function renderOptions(q) {
  optsEl.innerHTML = '';
  const list = makeOptions(q);
  for (let i = 0; i < list.length; i++) {
    const b = document.createElement('button');
    b.className = 'opt';
    b.type = 'button';
    b.textContent = list[i];
    b.dataset.value = list[i];
    b.addEventListener('click', function () { answer(b, list[i], q); });
    optsEl.appendChild(b);
  }
}

function lockOptions() {
  const list = optsEl.querySelectorAll('.opt');
  for (let i = 0; i < list.length; i++) list[i].disabled = true;
}

// Ответ раньше исхода: сначала пауза, потом результат
function answer(btn, value, q) {
  if (state.busy || state.over) return;
  state.busy = true;
  lockOptions();
  btn.classList.add('chosen');
  sClick();

  later(function () {
    btn.classList.remove('chosen');
    const ok = (value === q.answer);
    const list = optsEl.querySelectorAll('.opt');
    for (let i = 0; i < list.length; i++) {
      const el = list[i];
      if (el.dataset.value === q.answer) el.classList.add('right');
      else if (el === btn) el.classList.add('wrong');
      else el.classList.add('fade');
    }

    if (ok) {
      openTile();
      hintEl.textContent = '✔ ' + q.hint;
      hintEl.classList.add('show');
      if (state.opened >= TILE_COUNT) {
        later(function () { finish(false); }, 900);
        return;
      }
      later(function () { state.busy = false; nextQuestion(); }, 1250);
    } else {
      sMiss();
      hintEl.textContent = '✘ Правильно: ' + q.answer + '. ' + q.hint;
      hintEl.classList.add('show');
      later(function () { state.busy = false; nextQuestion(); }, 2400);
    }
  }, 700);
}

/* ============================================================
   ДОГАДКА: «Я ЗНАЮ!» → учитель подтверждает
   ============================================================ */
function openAsk() {
  if (state.busy || state.over) return;
  state.busy = true;
  sClick();
  refreshMeters(false);
  const pic = state.pic;
  teacherHint.innerHTML = 'Для учителя: <b>' + pic.name + '</b>. Засчитываем: ' +
    pic.answers.join(', ') + '.';
  askModal.classList.add('show');
}

function closeAsk() {
  askModal.classList.remove('show');
}

function guessRight() {
  closeAsk();
  state.busy = true;
  finish(true);
}

function guessWrong() {
  closeAsk();
  state.misses++;
  sPshik();
  const n = returnTiles(2);
  showToast('ЕЩЁ РАНО…', 1700);
  later(function () {
    if (n > 0) showToast(n === 1 ? 'ПЛИТКА ВЕРНУЛАСЬ' : 'ДВЕ ПЛИТКИ ВЕРНУЛИСЬ', 1400);
  }, 1750);
  later(function () { state.busy = false; }, 900);
}

/* ============================================================
   ФИНАЛ
   ============================================================ */
function finish(guessed) {
  if (state.over) return;
  state.over = true;
  state.busy = true;
  knowBtn.disabled = true;
  knowBtn.classList.remove('pulse');
  lockOptions();
  closeAsk();

  const openedAt = state.opened;
  const score = guessed ? potential() : 0;
  const pic = state.pic;
  const parts = pic.name.split('/');
  const ru = parts[0].trim();
  const de = (parts[1] || '').trim();

  if (guessed) {
    sWin();
    lightWave();
    sparks(REDUCED ? 0 : 52);
    // Оставшиеся плитки разлетаются веером
    const cx = (COLS - 1) / 2, cy = (ROWS - 1) / 2;
    for (let i = state.opened; i < TILE_COUNT; i++) {
      const idx = state.order[i];
      const t = state.tiles[idx];
      if (!t) continue;
      const row = Math.floor(idx / COLS), col = idx % COLS;
      let dx = col - cx, dy = row - cy;
      const len = Math.sqrt(dx * dx + dy * dy) || 1;
      dx /= len; dy /= len;
      const dist = 90 + Math.random() * 90;
      t.style.setProperty('--fx', (dx * dist).toFixed(1) + '%');
      t.style.setProperty('--fy', (dy * dist).toFixed(1) + '%');
      t.style.setProperty('--fr', (Math.random() * 160 - 80).toFixed(0) + 'deg');
      const el = t;
      later(function () { el.classList.add('fan'); }, (i - state.opened) * 28);
    }
  } else {
    lightWave();
    tone(392, 0.7, {type: 'sine', vol: 0.11, attack: 0.06});
    tone(523.25, 0.7, {type: 'sine', vol: 0.09, attack: 0.06, delay: 0.12});
  }

  frameEl.style.setProperty('--glow', '80');

  // Картинка во весь экран на секунду с названием
  later(function () {
    buildPicture(revealPic, pic);
    revealRu.textContent = ru;
    revealDe.textContent = de;
    revealEl.classList.add('show');
    later(function () { sizePic(revealPic); }, 60);
  }, guessed ? 700 : 500);

  later(function () {
    revealEl.classList.remove('show');
    later(function () { revealEl.style.display = ''; }, 520);
  }, guessed ? 2500 : 2300);

  // Финальная панель
  later(function () {
    endEmoji.textContent = pic.emoji;
    endTitle.textContent = guessed ? 'ПРОЯВИЛОСЬ!' : 'НУ, ТЕПЕРЬ-ТО ВИДНО';
    endRu.textContent = ru;
    endDe.textContent = de;
    endScore.textContent = String(score);
    if (guessed && openedAt === 0) {
      endLine.textContent = 'Ты угадал, не открыв НИ ОДНОЙ плитки из ' + TILE_COUNT + '. Это уже ясновидение!';
    } else if (guessed) {
      endLine.textContent = 'Ты угадал, когда было открыто всего ' + openedAt +
        ' ' + tilesWord(openedAt) + ' из ' + TILE_COUNT + '!';
    } else {
      endLine.textContent = 'Все ' + TILE_COUNT + ' плиток открылись сами. Бонуса нет — зато немецкий подтянулся.';
    }
    endPenalty.textContent = state.misses > 0
      ? ('Ранних догадок мимо: ' + state.misses + ' (−' + (state.misses * MISS_PENALTY) + ')')
      : '';
    endModal.classList.add('show');
    sFanfare();
  }, guessed ? 3000 : 2800);
}

function tilesWord(n) {
  const n10 = n % 10, n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return 'плитка';
  if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return 'плитки';
  return 'плиток';
}

/* ============================================================
   СТАРТ И РЕСТАРТ
   ============================================================ */
function pickPicture() {
  if (PICTURES.length === 1) return 0;
  let i = Math.floor(Math.random() * PICTURES.length);
  let guard = 0;
  while (i === state.picIndex && guard < 20) {
    i = Math.floor(Math.random() * PICTURES.length);
    guard++;
  }
  return i;
}

function startGame() {
  clearTimers();

  state.picIndex = pickPicture();
  state.pic = PICTURES[state.picIndex];
  state.opened = 0;
  state.misses = 0;
  state.busy = false;
  state.over = false;
  state.queue = [];
  state.current = null;
  state.lastPrompt = '';

  askModal.classList.remove('show');
  endModal.classList.remove('show');
  revealEl.classList.remove('show');
  toastEl.classList.remove('show');
  fxEl.innerHTML = '';
  const rings = document.querySelectorAll('.wave-ring');
  for (let i = 0; i < rings.length; i++) {
    if (rings[i].parentNode) rings[i].parentNode.removeChild(rings[i]);
  }

  knowBtn.disabled = false;
  hintEl.textContent = '';
  hintEl.classList.remove('show');

  buildPicture(picEl, state.pic);
  buildTiles();
  refreshMeters(false);
  nextQuestion();
  later(resizeAllPics, 80);
}

/* ============================================================
   СОБЫТИЯ
   ============================================================ */
knowBtn.addEventListener('click', openAsk);
document.getElementById('btnYes').addEventListener('click', guessRight);
document.getElementById('btnNo').addEventListener('click', guessWrong);
document.getElementById('btnCancel').addEventListener('click', function () {
  closeAsk();
  sClick();
  state.busy = false;
});
document.getElementById('btnAgain').addEventListener('click', function () {
  sClick();
  startGame();
});

soundBtn.addEventListener('click', function () {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
  try { localStorage.setItem('proyavlenie-sound', soundOn ? 'on' : 'off'); } catch (e) { /* приватный режим */ }
  if (soundOn) sClick();
});
soundBtn.textContent = soundOn ? '🔊' : '🔇';

// Поехали
startGame();
</script>
